name: Actualizar releases.json

on:
  # Disparo instantáneo: el repo RagnarokManifests/games manda un repository_dispatch
  # apenas publica un release (ver .github/workflows/notify-pagina.yml allá).
  repository_dispatch:
    types: [nuevo-release]
  # Red de seguridad por si el disparo falla. GitHub no acepta menos de 5 min.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Si ya hay una corrida en curso, la nueva la reemplaza en vez de encolarse.
concurrency:
  group: update-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-releases-json.mjs

      - name: Espejar el instalador como .zip en este repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mirror-zip.mjs

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- releases.json; then
            echo "Sin cambios en releases.json"
          else
            git add releases.json
            git commit -m "chore: actualizar releases.json"
            git push
          fi
