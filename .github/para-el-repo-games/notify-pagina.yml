# ESTE ARCHIVO NO CORRE ACÁ. Va copiado en el OTRO repo:
#   RagnarokManifests/games -> .github/workflows/notify-pagina.yml
#
# Apenas se publica un release en "games", dispara el workflow de la página,
# así releases.json se regenera en el momento en vez de esperar al cron.
#
# Requiere un secret PAGINA_DISPATCH_TOKEN en el repo "games":
#   1. GitHub -> Settings -> Developer settings -> Personal access tokens
#      -> Fine-grained tokens -> Generate new token
#      Repository access: solo RagnarokManifests/paginatst
#      Permissions: Contents = Read and write
#   2. Repo "games" -> Settings -> Secrets and variables -> Actions
#      -> New repository secret -> nombre: PAGINA_DISPATCH_TOKEN

name: Avisar a la pagina

on:
  release:
    types: [published, released, edited]
  workflow_dispatch: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar update-releases en paginatst
        env:
          TOKEN: ${{ secrets.PAGINA_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/RagnarokManifests/paginatst/dispatches \
            -d '{"event_type":"nuevo-release"}'
